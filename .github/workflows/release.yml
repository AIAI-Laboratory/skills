name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate release notes
        run: python scripts/generate-release-notes.py --version "$GITHUB_REF_NAME" > release-body.md

      - name: Commit release notes
        run: |
          if [ -z "$(git status --porcelain RELEASE-NOTES.md)" ]; then
            echo "Release notes already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add RELEASE-NOTES.md
            git commit -m "docs: add release notes for $GITHUB_REF_NAME"
            git push
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-body.md
