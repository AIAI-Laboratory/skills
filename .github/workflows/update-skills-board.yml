name: Update skills board

# pull_request_target (not pull_request) so the job gets a write token for PRs
# from forks. We only ever check out and run code from main, never the PR head,
# so this is safe.
on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skills-board
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh README
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ -n "$PR_AUTHOR" ]; then
            python scripts/update-readme.py --add-contributor "$PR_AUTHOR"
          else
            python scripts/update-readme.py
          fi

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/contributors.json
          git commit -m "chore: refresh skills board and contributors"
          git push
